name: Send Douyin Messages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only verify login and friends without sending
        type: boolean
        default: true
  schedule:
    # UTC 00:30 = Asia/Shanghai 08:30. GitHub may delay scheduled runs.
    - cron: "30 0 * * *"

concurrency:
  group: douyin-daily-sender
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    # Enable daily sending only after validation by setting this repository variable.
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_SEND_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEADLESS: "true"
      TRACE: "false"
      TZ: "Asia/Shanghai"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Validate and write protected configuration
        env:
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          try:
              cookies = json.loads(os.environ["DOUYIN_COOKIE"])
              config = json.loads(os.environ["DOUYIN_CONFIG"])
          except (KeyError, json.JSONDecodeError):
              raise SystemExit("Required Secrets are missing or invalid JSON.")
          if not isinstance(cookies, list) or not cookies:
              raise SystemExit("DOUYIN_COOKIE must be a non-empty JSON array.")
          if not all(isinstance(c, dict) and c.get("name") and "value" in c for c in cookies):
              raise SystemExit("DOUYIN_COOKIE has invalid cookie entries.")
          if not isinstance(config, dict):
              raise SystemExit("DOUYIN_CONFIG must be a JSON object.")
          path = Path("config.json")
          path.write_text(json.dumps(config, ensure_ascii=False), encoding="utf-8")
          path.chmod(0o600)
          print("Protected configuration validated.")
          PY
      - name: Run
        env:
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          RUN_DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [[ "$RUN_DRY" == "true" ]]; then
            python run.py --dry-run
          else
            python run.py
          fi
